<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Match Admin Login</title><style>body{font-family:system-ui;background:#f7f9fc;margin:0}.box{max-width:420px;margin:12vh auto;background:#fff;padding:30px;border:1px solid #e5e9ef;border-radius:18px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #dfe4ec;font:inherit}button{background:#ff6b35;color:#fff;font-weight:800;border:0;cursor:pointer}.msg{font-size:13px;color:#64748b}</style></head><body><div class="box"><h1>Tutor Match Admin</h1><p class="msg">Sign in to manage parent requests, tutors, matches and placements.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="msg" class="msg"></div></div><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient(TUTOR_MATCH_CONFIG.SUPABASE_URL,TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY);async function login(){msg.textContent="Signing in…";const r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){msg.textContent=r.error.message;return}location.href="dashboard.html"}</script></body></html>
