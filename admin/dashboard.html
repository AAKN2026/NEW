<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Match Admin Dashboard</title><style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f7f9fc;color:#162033;margin:0}.wrap{max-width:1250px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#64748b;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #e5e9ef;border-radius:15px;padding:18px}.n{font-size:30px;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}button,select{padding:8px 10px;border-radius:8px;border:1px solid #dfe4ec;background:#fff;font:inherit;cursor:pointer}button.primary{background:#ff6b35;color:#fff;border-color:#ff6b35;font-weight:800}.panel{margin-top:18px;overflow:auto}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff1eb;font-size:11px;font-weight:800}.matchrow{background:#f9fbfd}.empty{padding:20px;color:#64748b}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}table{min-width:850px}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Tutor Match Admin</h1><div class="muted">Requests → matching → trial → placement → follow-up → rematch</div></div><button onclick="logout()">Sign out</button></div><div class="cards" id="stats"></div>
<section class="card panel"><h2>Parent Requests</h2><div id="requests" class="empty">Loading…</div></section>
<section class="card panel"><h2>Matches</h2><div id="matches" class="empty">Select “Find Matches” on a request.</div></section>
<section class="card panel"><h2>Tutor Pool</h2><div id="tutors" class="empty">Loading…</div></section>
</div>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient(TUTOR_MATCH_CONFIG.SUPABASE_URL,TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function wa(phone,text){window.open("https://wa.me/"+String(phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text),"_blank","noopener")}
async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="login.html";return}load()}
async function load(){
 const [{data:r,error:re},{data:t,error:te},{data:m},{data:p}]=await Promise.all([
  sb.from("parent_requests").select("*").order("created_at",{ascending:false}).limit(100),
  sb.from("tutors").select("*").order("created_at",{ascending:false}),
  sb.from("matches").select("*").order("match_score",{ascending:false}),
  sb.from("placements").select("*")
 ]);
 if(re||te){document.getElementById("requests").innerHTML='<div class="empty">Unable to load data. Check Supabase configuration and admin permissions.</div>';return}
 const reqs=r||[], tutors=t||[], matches0=m||[], placements=p||[];
 document.getElementById("stats").innerHTML=[["New Requests",reqs.filter(x=>x.status==="new").length],["Active Tutors",tutors.filter(x=>["verified","active"].includes(x.status)).length],["Matches",matches0.length],["Active Placements",placements.filter(x=>x.status==="active").length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="n">'+x[1]+'</div></div>').join("");
 document.getElementById("requests").innerHTML=reqs.length?'<table><tr><th>Parent</th><th>Requirement</th><th>Location</th><th>Status</th><th>Actions</th></tr>'+reqs.map(x=>'<tr><td><strong>'+esc(x.parent_name)+'</strong><br><span class="muted">'+esc(x.whatsapp)+'</span></td><td>'+esc(x.student_level)+' · '+esc(x.subject)+'<br><span class="muted">'+esc(x.lesson_format||"")+' · '+esc(x.budget||"")+'</span></td><td>'+esc(x.location||"")+'</td><td><select onchange="setStatus(\''+x.id+'\',this.value)">'+["new","contacted","matching","shortlisted","trial","confirmed","follow-up","rematch","closed"].map(s=>'<option value="'+s+'" '+(x.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select></td><td><button class="primary" onclick="findMatches(\''+x.id+'\')">Find Matches</button> <button onclick="wa(\''+esc(x.whatsapp)+'\',\'Hi '+esc(x.parent_name)+', this is Tutor Match. We are reviewing suitable tutor options for you.\')">WhatsApp</button></td></tr>').join("")+'</table>':'<div class="empty">No parent requests yet.</div>';
 document.getElementById("tutors").innerHTML=tutors.length?'<table><tr><th>Tutor</th><th>Subjects / Levels</th><th>Format</th><th>Location</th><th>Status</th><th>Action</th></tr>'+tutors.map(x=>'<tr><td><strong>'+esc(x.full_name)+'</strong><br><span class="muted">'+esc(x.whatsapp)+'</span></td><td>'+esc((x.subjects||[]).join(", "))+'<br>'+esc((x.levels||[]).join(", "))+'</td><td>'+esc((x.lesson_formats||[]).join(", "))+'</td><td>'+esc((x.locations||[]).join(", "))+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td><select onchange="setTutorStatus(\''+x.id+'\',this.value)">'+["pending","verified","active","paused","inactive"].map(s=>'<option value="'+s+'" '+(x.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select> <button onclick="wa(\''+esc(x.whatsapp)+'\',\'Hi '+esc(x.full_name)+', Tutor Match has a potential student enquiry for you. Are you available?\')">WhatsApp</button></td></tr>').join("")+'</table>':'<div class="empty">No tutors yet.</div>';
}
async function setStatus(id,status){await sb.from("parent_requests").update({status}).eq("id",id);load()}
async function setTutorStatus(id,status){await sb.from("tutors").update({status}).eq("id",id);load()}
async function findMatches(id){
 document.getElementById("matches").innerHTML='<div class="empty">Calculating matches…</div>';
 const r=await fetch(TUTOR_MATCH_CONFIG.SUPABASE_URL+"/functions/v1/generate-matches",{method:"POST",headers:{"Content-Type":"application/json","apikey":TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({request_id:id})});
 const j=await r.json();if(!j.ok){document.getElementById("matches").innerHTML='<div class="empty">'+esc(j.error)+'</div>';return}
 document.getElementById("matches").innerHTML=j.matches.length?'<table><tr><th>Tutor</th><th>Score</th><th>Why</th><th>Action</th></tr>'+j.matches.map(x=>'<tr class="matchrow"><td><strong>'+esc(x.tutor_name)+'</strong></td><td><strong>'+x.match_score+'%</strong></td><td>'+esc(JSON.stringify(x.score_breakdown||{}))+'</td><td><button class="primary" onclick="contactTutor(\''+x.tutor_id+'\',\''+id+'\')">WhatsApp Tutor</button></td></tr>').join("")+'</table>':'<div class="empty">No active tutor reached the current matching threshold. Try adjusting the request or tutor pool.</div>';
}
async function contactTutor(tutorId,requestId){
 const [{data:t},{data:r}]=await Promise.all([sb.from("tutors").select("*").eq("id",tutorId).single(),sb.from("parent_requests").select("*").eq("id",requestId).single()]);
 if(!t||!r)return;
 await sb.from("matches").update({status:"contacted"}).eq("request_id",requestId).eq("tutor_id",tutorId);
 wa(t.whatsapp,"Hi "+t.full_name+", Tutor Match has a potential student enquiry.\n\nLevel: "+r.student_level+"\nSubject: "+r.subject+"\nFormat: "+(r.lesson_format||"Flexible")+"\nLocation: "+(r.location||"TBC")+"\nBudget: "+(r.budget||"TBC")+"\nSchedule: "+(r.preferred_schedule||"TBC")+"\n\nPlease let us know if you are available.");
}
async function logout(){await sb.auth.signOut();location.href="login.html"} guard();
</script></body></html>
