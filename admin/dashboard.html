<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Match Admin Dashboard</title><style>body{font-family:system-ui;background:#f7f9fc;color:#162033;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e9ef;border-radius:15px;padding:18px}.n{font-size:30px;font-weight:900}.muted{color:#64748b;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px}button,select{padding:8px 11px;border-radius:8px;border:1px solid #dfe4ec;background:#fff}button.primary{background:#ff6b35;color:#fff;border-color:#ff6b35;font-weight:800}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>Tutor Match Admin</h1><div class="muted">Live operations dashboard</div></div><button onclick="logout()">Sign out</button></div><div class="cards" id="stats"></div><section class="card" style="margin-top:18px"><h2>New Parent Requests</h2><div id="requests">Loading…</div></section><section class="card" style="margin-top:18px"><h2>Top Matches</h2><div id="matches">Select a request to generate matches.</div></section></div><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient(TUTOR_MATCH_CONFIG.SUPABASE_URL,TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY);async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session)location.href="login.html";else load()}async function load(){const [{data:r},{data:t},{data:m},{data:p}]=await Promise.all([sb.from("parent_requests").select("*").order("created_at",{ascending:false}).limit(100),sb.from("tutors").select("*"),sb.from("matches").select("*"),sb.from("placements").select("*")]);stats.innerHTML=[["New",r?.filter(x=>x.status==="new").length||0],["Tutors",t?.filter(x=>["verified","active"].includes(x.status)).length||0],["Matches",m?.length||0],["Active",p?.filter(x=>x.status==="active").length||0]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="n">'+x[1]+'</div></div>').join("");requests.innerHTML='<table><tr><th>Parent</th><th>Level</th><th>Subject</th><th>Location</th><th>Status</th><th>Action</th></tr>'+((r||[]).map(x=>'<tr><td>'+esc(x.parent_name)+'</td><td>'+esc(x.student_level)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.location||"")+'</td><td><select onchange="status(\''+x.id+'\',this.value)">'+["new","contacted","matching","shortlisted","trial","confirmed","follow-up","rematch","closed"].map(s=>'<option '+(s===x.status?"selected":"")+'>'+s+'</option>').join("")+'</select></td><td><button class="primary" onclick="match(\''+x.id+'\')">Find Matches</button> <button onclick="wa(\''+x.whatsapp+"\',\'"+x.id+"\')">WhatsApp</button></td></tr>').join(""))+'</table>'}async function status(id,s){await sb.from("parent_requests").update({status:s}).eq("id",id);load()}async function match(id){matches.textContent="Matching…";const r=await fetch(TUTOR_MATCH_CONFIG.SUPABASE_URL+"/functions/v1/generate-matches",{method:"POST",headers:{"Content-Type":"application/json","apikey":TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({request_id:id})});const j=await r.json();if(!j.ok){matches.textContent=j.error;return}matches.innerHTML='<table><tr><th>Tutor</th><th>Score</th><th>Action</th></tr>'+j.matches.map(x=>'<tr><td>'+esc(x.tutor_name)+'</td><td><strong>'+x.match_score+'%</strong></td><td><button onclick="tutorWa(\''+x.tutor_id+"\')">WhatsApp Tutor</button></td></tr>").join("")+'</table>'}async function tutorWa(id){const{data:t}=await sb.from("tutors").select("*").eq("id",id).single();if(t)window.open("https://wa.me/"+t.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent("Hi "+t.full_name+", we have a potential Tutor Match enquiry for you. Please let us know if you are available."),"_blank")}function wa(phone,id){window.open("https://wa.me/"+phone.replace(/\D/g,"")+"?text="+encodeURIComponent("Hi, this is Tutor Match. We have received your tutor request and are working on suitable options for you. Request ID: "+id),"_blank")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}async function logout(){await sb.auth.signOut();location.href="login.html"}guard();</script></body></html>
