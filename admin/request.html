<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMatch Request</title><style>body{font-family:system-ui;background:#f6f8fb;color:#162033;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 18px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:18px;margin:14px 0}.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #eef1f5}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button,select,input,textarea{padding:9px;border:1px solid #dce2ea;border-radius:9px;font:inherit}button{cursor:pointer}.primary{background:#ff6b35;color:white;font-weight:800}.muted{color:#64748b;font-size:13px}.match{border:1px solid #e5e9ef;border-radius:12px;padding:13px;margin:9px 0}.bar{height:8px;background:#edf1f5;border-radius:9px;margin:4px 0 8px}.fill{height:100%;background:#ff6b35;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="dashboard.html">← Back to CRM</a><h1 id="head">Request</h1><div id="app">Loading…</div></div><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient(TUTOR_MATCH_CONFIG.SUPABASE_URL,TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get("id");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function wa(p,t){open("https://wa.me/"+String(p||"").replace(/\D/g,"")+"?text="+encodeURIComponent(t),"_blank")}
async function log(action,type="request",eid=id,details={}){const u=(await sb.auth.getUser()).data.user;await sb.from("admin_activity_logs").insert({admin_user_id:u?.id,action,entity_type:type,entity_id:eid,details})}
async function guard(){if(!(await sb.auth.getSession()).data.session)location.href="login.html";else load()}
async function load(){const [rq,mm,pp,ll]=await Promise.all([sb.from("parent_requests").select("*").eq("id",id).single(),sb.from("matches").select("*").eq("request_id",id).order("match_rank",{ascending:true,nullsFirst:false}).order("match_score",{ascending:false}),sb.from("placements").select("*").eq("request_id",id).order("created_at",{ascending:false}),sb.from("admin_activity_logs").select("*").eq("entity_id",id).order("created_at",{ascending:false}).limit(30)]);const r=rq.data;if(!r){app.innerHTML="Request not found";return}head.textContent="Request · "+r.parent_name;const ms=mm.data||[],ps=pp.data||[],ids=ms.map(x=>x.tutor_id);let ts=[];if(ids.length)ts=(await sb.from("tutors").select("*").in("id",ids)).data||[];const tm=new Map(ts.map(t=>[t.id,t])),p=ps[0];app.innerHTML='<div class="grid"><div><section class="card"><h2>Parent Request</h2>'+[["Parent",r.parent_name],["WhatsApp",r.whatsapp],["Level",r.student_level],["Subject",r.subject],["Format",r.lesson_format],["Budget",r.budget],["Location",r.location],["Schedule",r.preferred_schedule],["Requirements",r.requirements]].map(x=>'<div class="kv"><b>'+x[0]+'</b><span>'+esc(x[1]||"—")+'</span></div>').join("")+'<div class="actions"><select id="status">'+["new","contacted","matching","shortlisted","trial","confirmed","follow-up","rematch","closed"].map(s=>'<option '+(r.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="primary" onclick="saveStatus()">Save Status</button><button onclick="wa('+JSON.stringify(r.whatsapp)+','+JSON.stringify("Hi "+r.parent_name+", this is SmartMatch. We are following up on your tutor request.")+')">WhatsApp Parent</button></div></section><section class="card"><div class="row"><h2>Match Engine</h2><div class="muted">Requested Tutor is prioritised; backup tutors are ranked automatically. If a contacted tutor declines, the next shortlisted backup is promoted.</div><button class="primary" onclick="runMatch()">Find / Refresh</button></div><div id="matches">'+renderMatches(ms,tm)+'</div></section></div><div><section class="card"><h2>Confirmed Placement</h2><p class="muted">Confirm a match first, then save placement details.</p><label>Start date</label><input id="start" type="date" value="'+(p?.start_date||"")+'"><br><label>Follow-up date</label><input id="follow" type="date" value="'+(p?.follow_up_date||"")+'"><br><label>Agreed rate</label><input id="rate" type="number" value="'+(p?.agreed_rate??"")+'"><br><label>Notes</label><textarea id="notes">'+esc(p?.notes||"")+'</textarea><div class="actions"><button class="primary" onclick="savePlacement()">Save Placement</button><button onclick="rematch()">Rematch</button></div></section><section class="card"><h2>Admin Activity</h2>'+((ll.data||[]).map(x=>'<div class="muted" style="padding:7px 0;border-bottom:1px solid #eef1f5"><b>'+esc(x.action)+'</b><br>'+new Date(x.created_at).toLocaleString()+'</div>').join("")||"No activity yet.")+'</section></div></div>'}
function renderMatches(ms,tm){if(!ms.length)return '<p class="muted">No matches yet.</p>';return ms.map(m=>{const t=tm.get(m.tutor_id)||{},b=m.score_breakdown||{},label=m.source==='requested_tutor'?'⭐ Requested Tutor':(m.match_rank?'Backup #'+m.match_rank:'SmartMatch');return '<div class="match"><div class="row"><div><b>'+esc(t.full_name||"Tutor")+'</b><br><span class="muted">'+esc(label)+' · '+esc((t.subjects||[]).join(", "))+'</span></div><b>'+m.match_score+'%</b></div>'+Object.entries(b).map(([k,v])=>'<div class="muted">'+esc(k)+' · '+v+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,Number(v)/({subject:30,level:20,location:15,format:10,budget:10,availability:15}[k]||30)*100)+'%"></div></div>').join("")+'<div class="actions"><select onchange="matchStatus(\''+m.id+'\',this.value)">'+["shortlisted","contacted","accepted","declined","trial","confirmed","closed"].map(s=>'<option '+(m.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select><input id="trial-'+m.id+'" type="date" value="'+(m.trial_date||"")+'"><button onclick="saveTrial(\''+m.id+'\')">Trial Date</button><button class="primary" onclick="contact(\''+m.tutor_id+'\')">WhatsApp Tutor</button></div></div>'}).join("")}
async function saveStatus(){let s=status.value;if((await sb.from("parent_requests").update({status:s}).eq("id",id)).error)return alert("Update failed");await log("Request status → "+s);load()}
async function matchStatus(mid,s){if((await sb.from("matches").update({status:s}).eq("id",mid)).error)return alert("Update failed");await log("Match status → "+s,"match",mid,{status:s});load()}
async function saveTrial(mid){let d=document.getElementById("trial-"+mid).value||null;if((await sb.from("matches").update({trial_date:d}).eq("id",mid)).error)return alert("Save failed");await log("Trial date updated","match",mid,{trial_date:d});load()}
async function contact(tid){const token=crypto.randomUUID()+"-"+crypto.randomUUID();await sb.from("matches").update({response_token:token,status:"contacted"}).eq("request_id",id).eq("tutor_id",tid);const t=(await sb.from("tutors").select("*").eq("id",tid).single()).data,r=(await sb.from("parent_requests").select("*").eq("id",id).single()).data;if(!t)return;await sb.from("matches").update({status:"contacted"}).eq("request_id",id).eq("tutor_id",tid);await log("Tutor contacted","tutor",tid,{request_id:id,response_token:token});const responseUrl=new URL("../tutor-response.html?token="+encodeURIComponent(token),location.href).href;wa(t.whatsapp,"Hi "+t.full_name+", SmartMatch has a potential student enquiry.\nLevel: "+r.student_level+"\nSubject: "+r.subject+"\nFormat: "+(r.lesson_format||"Flexible")+"\nLocation: "+(r.location||"TBC")+"\nBudget: "+(r.budget||"TBC")+"\nSchedule: "+(r.preferred_schedule||"TBC")+"\n\nPlease respond here: "+responseUrl+"\n\nTap the link and choose \"I’m Available\" or \"I’m Not Available\".")}
async function runMatch(){const z=await fetch(TUTOR_MATCH_CONFIG.SUPABASE_URL+"/functions/v1/generate-matches",{method:"POST",headers:{"Content-Type":"application/json","apikey":TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({request_id:id})}),j=await z.json();if(!j.ok)return alert(j.error||"Match failed");await log("Matches generated");load()}
async function savePlacement(){const q=await sb.from("matches").select("*").eq("request_id",id).eq("status","confirmed").order("match_score",{ascending:false}).limit(1),m=q.data?.[0];if(!m)return alert("Mark a match as Confirmed first.");const existing=(await sb.from("placements").select("*").eq("request_id",id).limit(1)).data?.[0],t=(await sb.from("tutors").select("*").eq("id",m.tutor_id).single()).data,payload={request_id:id,tutor_id:m.tutor_id,start_date:start.value||null,lesson_format:"",agreed_rate:rate.value?Number(rate.value):(t?.hourly_rate||null),status:"active",follow_up_date:follow.value||null,notes:notes.value};const z=existing?await sb.from("placements").update(payload).eq("id",existing.id):await sb.from("placements").insert(payload);if(z.error)return alert(z.error.message);await sb.from("parent_requests").update({status:"confirmed"}).eq("id",id);await log("Placement confirmed","placement",existing?.id||null,{tutor_id:m.tutor_id,follow_up_date:follow.value||null});load()}
async function rematch(){if(!confirm("Start rematch?"))return;await sb.from("parent_requests").update({status:"rematch"}).eq("id",id);await sb.from("placements").update({status:"rematch"}).eq("request_id",id).eq("status","active");await log("Rematch started");load()}guard();</script></body></html>
