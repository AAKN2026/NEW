name: Sync Standard Subject Selectors

on:
  push:
    branches: [main]

jobs:
  sync-subjects:
    if: contains(github.event.head_commit.message, 'Sync standardized subject selectors') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Align parent subject selectors
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<select name="subject" required><option value="">Subject</option><option>Maths</option><option>Science / Physics / Chemistry</option><option>English</option><option>Chinese / Higher Chinese</option><option>Coding / STEM</option><option>Other</option></select>'
          new = '<select name="subject" required><option value="">Select subject</option><option>Maths</option><option>English</option><option>Chinese</option><option>Higher Chinese</option><option>Malay</option><option>Tamil</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>General Science</option><option>Economics</option><option>Accounting</option><option>Business Studies</option><option>History</option><option>Geography</option><option>Computer Science / Coding</option><option>Robotics / STEM</option><option>Piano / Music</option><option>Art</option><option>Drama / Dance</option><option>Other</option></select>'
          if old1 in s:
              s = s.replace(old1, new, 1)
          old2 = '<div><label>Subject</label><input name="Subject" placeholder="e.g. Maths" required></div>'
          new2 = '<div><label>Subject</label>' + new.replace('name="subject"','name="Subject"') + '</div>'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit aligned selectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync standardized subject selectors"
          git push

# trigger sync