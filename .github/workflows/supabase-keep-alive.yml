name: Supabase Keep Alive

on:
  # 20 lightweight Supabase REST health checks per day (UTC).
  schedule:
    - cron: "13 0 * * *"
    - cron: "25 1 * * *"
    - cron: "37 2 * * *"
    - cron: "49 3 * * *"
    - cron: "1 5 * * *"
    - cron: "13 6 * * *"
    - cron: "25 7 * * *"
    - cron: "37 8 * * *"
    - cron: "49 9 * * *"
    - cron: "1 11 * * *"
    - cron: "13 12 * * *"
    - cron: "25 13 * * *"
    - cron: "37 14 * * *"
    - cron: "49 15 * * *"
    - cron: "1 17 * * *"
    - cron: "13 18 * * *"
    - cron: "25 19 * * *"
    - cron: "37 20 * * *"
    - cron: "49 21 * * *"
    - cron: "1 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keep-alive.yml"

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase REST API and database
        env:
          SUPABASE_URL: https://bdgbcyiplvoqvmufoztp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_hP17wyiXJuUKvOyG0JiLjg_h1HqUZ33
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while (( attempt <= max_attempts )); do
            echo "Supabase health check attempt ${attempt}/${max_attempts}"
            code="$(curl --silent --show-error --output /tmp/supabase-response.json --write-out "%{http_code}" \
              --max-time 20 \
              --get "${SUPABASE_URL}/rest/v1/tutors" \
              --data-urlencode "select=id" \
              --data-urlencode "limit=1" \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Accept: application/json" || true)"

            if [[ "${code:-000}" =~ ^2[0-9][0-9]$ ]]; then
              echo "Supabase REST/database check succeeded (HTTP ${code})."
              exit 0
            fi

            echo "Supabase check returned HTTP ${code:-000}."
            if [[ -f /tmp/supabase-response.json ]]; then
              cat /tmp/supabase-response.json
              echo
            fi
            if (( attempt < max_attempts )); then
              sleep 10
            fi
            ((attempt+=1))
          done

          echo "::error::Supabase health check failed after ${max_attempts} attempts."
          exit 1
