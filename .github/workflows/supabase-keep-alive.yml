name: Supabase Keep Alive

on:
  schedule:
    - cron: "13 0 * * *"
    - cron: "25 1 * * *"
    - cron: "37 2 * * *"
    - cron: "49 3 * * *"
    - cron: "1 5 * * *"
    - cron: "13 6 * * *"
    - cron: "25 7 * * *"
    - cron: "37 8 * * *"
    - cron: "49 9 * * *"
    - cron: "1 11 * * *"
    - cron: "13 12 * * *"
    - cron: "25 13 * * *"
    - cron: "37 14 * * *"
    - cron: "49 15 * * *"
    - cron: "1 17 * * *"
    - cron: "13 18 * * *"
    - cron: "25 19 * * *"
    - cron: "37 20 * * *"
    - cron: "49 21 * * *"
    - cron: "1 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keep-alive.yml"

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase database using safe RPC
        env:
          SUPABASE_URL: https://bdgbcyiplvoqvmufoztp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_hP17wyiXJuUKvOyG0JiLjg_h1HqUZ33
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while (( attempt <= max_attempts )); do
            echo "Supabase database check attempt $attempt/$max_attempts"
            code=$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -H "Accept: application/json" -d '{}' || true)
            if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Supabase database RPC check succeeded (HTTP $code)."
              cat /tmp/response.json
              exit 0
            fi
            echo "Supabase check returned HTTP $code."
            cat /tmp/response.json || true
            if (( attempt < max_attempts )); then sleep 10; fi
            ((attempt+=1))
          done
          echo "::error::Supabase database check failed after $max_attempts attempts."
          exit 1
