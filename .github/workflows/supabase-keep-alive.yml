name: Supabase Keep Alive

on:
  # 20 lightweight database API reads per day (UTC).
  schedule:
    - cron: "13 0 * * *"
    - cron: "25 1 * * *"
    - cron: "37 2 * * *"
    - cron: "49 3 * * *"
    - cron: "1 5 * * *"
    - cron: "13 6 * * *"
    - cron: "25 7 * * *"
    - cron: "37 8 * * *"
    - cron: "49 9 * * *"
    - cron: "1 11 * * *"
    - cron: "13 12 * * *"
    - cron: "25 13 * * *"
    - cron: "37 14 * * *"
    - cron: "49 15 * * *"
    - cron: "1 17 * * *"
    - cron: "13 18 * * *"
    - cron: "25 19 * * *"
    - cron: "37 20 * * *"
    - cron: "49 21 * * *"
    - cron: "1 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: https://bdgbcyiplvoqvmufoztp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_hP17wyiXJuUKvOyG0JiLjg_h1HqUZ33
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/supabase-response.json --write-out "%{http_code}" \
            --max-time 20 \
            --get "$SUPABASE_URL/rest/v1/tutors" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Accept: application/json")"
          echo "Supabase REST response: HTTP $code"
          cat /tmp/supabase-response.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Supabase keep-alive query failed."
            exit 1
          fi
          echo "Supabase database query completed successfully."
