<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find a Tutor | SmartMatch Singapore</title><meta name="description" content="Browse verified and active SmartMatch tutors in Singapore."><style>:root{--ink:#162033;--muted:#64748b;--brand:#ff6b35;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);line-height:1.55}a{text-decoration:none;color:inherit}.container{width:min(1160px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900}.mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;margin-right:8px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:10px;font-weight:800;border:1px solid var(--line)}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.hero{background:#f7f9fc;padding:56px 0 34px}.eyebrow{color:var(--brand);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(38px,5vw,58px);line-height:1.05;margin:8px 0}.hero p{color:var(--muted);max-width:720px}.search{margin-top:25px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}select{padding:12px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;background:#fff}.cards{padding:44px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--line);border-radius:18px;padding:21px;transition:.2s;background:#fff}.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(25,39,63,.08)}.head{display:flex;gap:13px;align-items:center}.avatar{width:58px;height:58px;border-radius:16px;background:#eaf1ff;display:grid;place-items:center;font-weight:900;color:#355ca8}.card h2{font-size:19px;margin:0}.role{font-size:12px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{font-size:11px;font-weight:800;background:#f5f7fa;color:#526071;padding:5px 8px;border-radius:999px}.desc{font-size:13px;color:var(--muted);min-height:60px}.bottom{border-top:1px solid #edf0f4;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:35px;text-align:center;border:1px dashed #ccd3dd;border-radius:16px;color:var(--muted);grid-column:1/-1}footer{background:#0c182c;color:#b9c4d4;padding:32px 0;margin-top:30px}@media(max-width:900px){.search{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.search,.grid{grid-template-columns:1fr}}</style></head><body><header><div class="container nav"><a class="logo" href="index.html"><span class="mark">S</span>SmartMatch</a><div><a class="btn" href="tutor.html">Become a Tutor</a><a class="btn primary" href="index.html#match-form" style="margin-left:7px">Request a Match</a></div></div></header><main><section class="hero"><div class="container"><div class="eyebrow">Live tutor directory</div><h1>Find a tutor that fits.</h1><p>Browse tutors currently listed as <strong>verified</strong> or <strong>active</strong> in SmartMatch. Final availability and rates are confirmed before placement.</p><div class="search"><select id="level"><option value="">Any level</option></select><select id="subject"><option value="">Any subject</option></select><select id="format"><option value="">Any format</option></select><button class="btn primary" onclick="render()">Search</button></div></div></section><section class="cards"><div class="container"><div id="result" style="font-weight:800;margin-bottom:18px">Loading tutors...</div><div class="grid" id="grid"></div></div></section></main><footer><div class="container">© 2026 SmartMatch · <a href="index.html">Home</a> · <a href="tutor.html">Become a Tutor</a></div></footer><script src="config.js"></script><script>
let tutors=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function values(k){return [...new Set(tutors.flatMap(t=>Array.isArray(t[k])?t[k]:[]).filter(Boolean))].sort()}
function fill(id,a){a.forEach(x=>document.getElementById(id).insertAdjacentHTML('beforeend','<option value="'+esc(x)+'">'+esc(x)+'</option>'))}
function categoryMatch(t,c){if(!c||c==='all')return true;const x=((t.subjects||[]).join(' ')+' '+(t.levels||[]).join(' ')).toLowerCase();const map={academic:/math|science|physics|chemistry|biology|english|history|geography|account|economics|psle|o-level|a-level|jc|ip|ib|igcse/,languages:/english|chinese|mandarin|malay|tamil|language/,technology:/coding|python|robot|robotics|ai|stem|programming|computer/,arts:/piano|music|art|drama|dance|drawing/,sports:/sport|swim|badminton|tennis|fitness/,enrichment:/chess|writing|public speaking|enrichment/,exam:/psle|o-level|a-level|ib|igcse|exam/,'life-skills':/communication|study skills|business|life skills/};return (map[c]||/a^/).test(x)}function render(){const l=document.getElementById('level').value,s=document.getElementById('subject').value,f=document.getElementById('format').value,c=(new URLSearchParams(location.search).get('category')||'').toLowerCase();const list=tutors.filter(t=>categoryMatch(t,c)&&(!l||(t.levels||[]).includes(l))&&(!s||(t.subjects||[]).includes(s))&&(!f||(t.lesson_formats||[]).includes(f)));document.getElementById('result').textContent=list.length+' live tutor'+(list.length===1?'':'s')+' available';document.getElementById('grid').innerHTML=list.length?list.map(t=>{const initials=(t.full_name||'Tutor').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();const role=(t.subjects||[]).slice(0,3).join(' · ');const level=(t.levels||[]).slice(0,3).join(' · ');const chips=[t.experience_years?t.experience_years+' yrs experience':null,(t.lesson_formats||[]).slice(0,2).join(' / '),level].filter(Boolean);return '<a class="card" href="tutor-profile.html?id='+encodeURIComponent(t.id)+'"><div class="head"><div class="avatar">'+esc(initials)+'</div><div><h2>'+esc(t.full_name)+'</h2><div class="role">'+esc(role)+'</div></div></div><div class="chips">'+chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div><p class="desc">'+esc(t.profile||t.qualifications||'SmartMatch tutor profile. Contact us to confirm current availability and suitability.')+'</p><div class="bottom"><strong>'+esc(t.hourly_rate?'S$'+t.hourly_rate+'/hr':'Rate confirmed on request')+'</strong><span class="btn primary">View profile →</span></div></a>'}).join(''):'<div class="empty">No tutors match those filters yet. <a href="index.html#match-form" style="color:var(--brand);font-weight:800">Request a personalised match →</a></div>'}
async function load(){try{const r=await fetch(TUTOR_MATCH_CONFIG.SUPABASE_URL+'/rest/v1/public_tutor_profiles?select=id,full_name,subjects,levels,experience_years,lesson_formats,locations,hourly_rate,availability,qualifications,profile',{headers:{apikey:TUTOR_MATCH_CONFIG.SUPABASE_ANON_KEY}});if(!r.ok)throw new Error();tutors=await r.json();fill('level',values('levels'));fill('subject',values('subjects'));fill('format',values('lesson_formats'));const p=new URLSearchParams(location.search);if(p.get('level'))document.getElementById('level').value=p.get('level');if(p.get('subject'))document.getElementById('subject').value=p.get('subject');if(p.get('format'))document.getElementById('format').value=p.get('format');render()}catch(e){document.getElementById('result').textContent='Tutor directory temporarily unavailable';document.getElementById('grid').innerHTML='<div class="empty">Please <a href="index.html#match-form" style="color:var(--brand);font-weight:800">request a tutor match</a> and our team will help you.</div>'}}load();
</script></body></html>
